name: Release firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build firmware (blank .env → no WiFi credentials in the image)
        run: |
          rm -f .env
          pio run -e esp32s3

      - name: Make sure no credentials leaked into the image
        run: |
          # .env is auto-created from .env.example (blank WiFi) during the
          # build; verify the compiled-in strings are empty.
          grep -q '#define WIFI_SSID ""' src/local_config.h
          grep -q '#define WIFI_PASSWORD ""' src/local_config.h

      - name: Merge into a single flashable image
        run: |
          VER=${GITHUB_REF_NAME:-dev}
          B=.pio/build/esp32s3
          mkdir -p dist
          esptool.py --chip esp32s3 merge_bin \
            --flash_mode qio --flash_freq 80m --flash_size 16MB \
            -o dist/esp32-usb-to-airprint-$VER-esp32s3.bin \
            0x0     $B/bootloader.bin \
            0x8000  $B/partitions.bin \
            0xf000  $B/ota_data_initial.bin \
            0x20000 $B/firmware.bin
          (cd dist && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true

      - name: Upload as a workflow artifact (manual runs)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: firmware-esp32s3
          path: dist/*
